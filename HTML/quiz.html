<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../CSS/style.css">
    <link rel="stylesheet" href="../CSS/quiz.css">
    <title>God Of War — Quiz</title>
</head>
<body>

    <!-- HEADER -->
    <header class="header_style">
        <div style="display:flex; gap:12px; align-items:center;">
            <a href="index.html" class="botao_nav">Início</a>
        </div>

        <div class="div_logo">God Of War</div>

        <div style="display: flex; align-items: center; gap: 12px;">
            <span id="nome-usuario" class="usuario-logado"></span>
            <button class="botao_nav" onclick="sair()">Sair</button>
        </div>
    </header>

    <div class="quiz-pagina">

        <!-- Cabeçalho do quiz -->
        <div class="quiz-cabecalho">
            <div class="quiz-barra-lateral"></div>
            <div>
                <div class="quiz-titulo">Quiz — Mitologia Grega</div>
                <div class="quiz-subtitulo">Prove que você conhece a saga do Fantasma de Esparta</div>
            </div>
        </div>

        <!-- Barra de progresso -->
        <div class="barra-progresso">
            <div class="barra-fill" id="barra-progresso"></div>
        </div>

        <!-- Área das perguntas (preenchida pelo JS) -->
        <div id="container-perguntas"></div>

        <!-- Card de resultado (oculto até o final) -->
        <div class="resultado-card" id="resultado">
            <div class="resultado-emoji" id="res-emoji"></div>
            <div class="resultado-titulo">Resultado Final</div>
            <div class="resultado-placar" id="res-placar"></div>
            <div class="resultado-msg" id="res-msg"></div>
            <div style="display:flex; gap:14px; justify-content:center; flex-wrap:wrap;">
                <button class="btn-reiniciar" onclick="reiniciar()">Tentar Novamente</button>
                <a href="index.html" class="btn-reiniciar" style="text-decoration:none; display:inline-block;">
                    Voltar ao Início
                </a>
            </div>
        </div>

    </div>

    <script>
        // ===== VERIFICAÇÃO DE LOGIN =====
        // Se não tiver ninguém logado, volta para o login
        var usuarioLogado = JSON.parse(localStorage.getItem('usuarioLogado'));
        if (!usuarioLogado) {
            window.location.href = 'login.html';
        } else {
            // Mostra o nome do guerreiro no header
            document.getElementById('nome-usuario').textContent = '⚔ ' + usuarioLogado.nome.split(' ')[0];
        }

        function sair() {
            localStorage.removeItem('usuarioLogado');
            window.location.href = 'login.html';
        }

        // ===== PERGUNTAS DO QUIZ =====
        var perguntas = [
            {
                texto: "Quem é o pai de Kratos na franquia?",
                opcoes: ["Poseidon", "Hades", "Zeus", "Ares"],
                correta: 2,
                explicacao: "Zeus é o pai de Kratos. Filho de uma mortal chamada Calisto, Kratos descobriu sua origem divina ao longo da saga."
            },
            {
                texto: "Qual é o nome das lâminas duplas dadas a Kratos por Ares no primeiro jogo?",
                opcoes: ["Lâminas do Exílio", "Lâminas do Caos", "Lâminas de Atena", "Garras de Hades"],
                correta: 1,
                explicacao: "As Lâminas do Caos foram entregues por Ares quando Kratos ofereceu sua alma em troca de poder para vencer uma batalha impossível."
            },
            {
                texto: "De acordo com o enredo de God of War II, qual Titã carrega os pilares do mundo em suas costas?",
                opcoes: ["Cronos", "Atlas", "Gaia", "Tifão"],
                correta: 1,
                explicacao: "Atlas foi condenado pelos deuses a carregar os pilares do mundo eternamente como punição."
            },
            {
                texto: "Qual divindade da sabedoria guia Kratos durante sua jornada de vingança contra o Olimpo?",
                opcoes: ["Hera", "Afrodite", "Ártemis", "Atena"],
                correta: 3,
                explicacao: "Atena, deusa da sabedoria, orienta Kratos ao longo da saga, mesmo que seus interesses nem sempre coincidam com os dele."
            },
            {
                texto: "Qual desses deuses foi o primeiro grande antagonista que Kratos derrotou no jogo original de 2005?",
                opcoes: ["Ares", "Tânatos", "Hélio", "Hermes"],
                correta: 0,
                explicacao: "Ares foi o grande vilão do primeiro God of War (2005). Kratos o matou para cumprir a promessa dos deuses e buscar perdão."
            },
            {
                texto: "Como Kratos escapou do submundo após ser traído e morto por Zeus no início de God of War II?",
                opcoes: [
                    "Ele usou a Caixa de Pandora",
                    "Ele fez um acordo com Hades",
                    "Ele foi resgatado e guiado pelo Titã Gaia",
                    "Ele derrotou as três Górgonas"
                ],
                correta: 2,
                explicacao: "A Titã Gaia resgatou Kratos do submundo e o guiou até as Irmãs do Destino para alterar seu passado e vingar-se de Zeus."
            },
            {
                texto: "Qual é o nome do irmão de Kratos, levado pelos deuses na infância por ter marcas consideradas uma maldição?",
                opcoes: ["Deimos", "Hércules", "Ceryx", "Perseu"],
                correta: 0,
                explicacao: "Deimos foi capturado pelos deuses quando criança por causa de uma profecia: um guerreiro marcado destruiria o Olimpo."
            }
        ];

        // ===== VARIÁVEIS DE ESTADO DO QUIZ =====
        var atual = 0;
        var pontos = 0;
        var respondeu = false;
        var LETRAS = ['A', 'B', 'C', 'D'];

        // ===== RENDERIZA TODAS AS PERGUNTAS =====
        function renderizar() {
            var cont = document.getElementById('container-perguntas');
            cont.innerHTML = '';

            perguntas.forEach(function(p, i) {
                var opcoesHTML = p.opcoes.map(function(op, j) {
                    return '<button class="opcao" id="op-' + i + '-' + j + '" onclick="responder(' + i + ',' + j + ')">'
                         + '<span class="letra">' + LETRAS[j] + ')</span> ' + op
                         + '</button>';
                }).join('');

                cont.innerHTML += '<div class="pergunta-card ' + (i === 0 ? 'ativa' : '') + '" id="card-' + i + '">'
                    + '<div class="num-pergunta">Pergunta ' + (i + 1) + ' de ' + perguntas.length + '</div>'
                    + '<div class="texto-pergunta">' + p.texto + '</div>'
                    + '<div class="opcoes">' + opcoesHTML + '</div>'
                    + '<div class="feedback-resposta" id="fb-' + i + '"></div>'
                    + '<button class="btn-proxima" id="prox-' + i + '" onclick="proxima(' + i + ')">'
                    + (i < perguntas.length - 1 ? 'Próxima Pergunta →' : 'Ver Resultado →')
                    + '</button>'
                    + '</div>';
            });
        }

        // ===== RESPONDE UMA PERGUNTA =====
        function responder(idxP, idxOp) {
            if (respondeu) return;
            respondeu = true;

            var p = perguntas[idxP];
            var fb = document.getElementById('fb-' + idxP);

            p.opcoes.forEach(function(_, j) {
                var btn = document.getElementById('op-' + idxP + '-' + j);
                btn.disabled = true;
                if (j === p.correta) btn.classList.add('correta');
                else if (j === idxOp) btn.classList.add('errada');
            });

            if (idxOp === p.correta) {
                pontos++;
                fb.className = 'feedback-resposta certo show';
                fb.innerHTML = '✔ Correto! ' + p.explicacao;
            } else {
                fb.className = 'feedback-resposta errado show';
                fb.innerHTML = '✘ Incorreto. ' + p.explicacao;
            }

            document.getElementById('prox-' + idxP).classList.add('show');
            atualizarBarra();
        }

        // ===== AVANÇA PARA A PRÓXIMA PERGUNTA =====
        function proxima(idx) {
            document.getElementById('card-' + idx).classList.remove('ativa');
            respondeu = false;
            atual++;
            if (atual < perguntas.length) {
                document.getElementById('card-' + atual).classList.add('ativa');
                atualizarBarra();
            } else {
                mostrarResultado();
            }
        }

        // ===== ATUALIZA A BARRA DE PROGRESSO =====
        function atualizarBarra() {
            var pct = ((atual + (respondeu ? 1 : 0)) / perguntas.length) * 100;
            document.getElementById('barra-progresso').style.width = pct + '%';
        }

        // ===== MOSTRA O RESULTADO FINAL =====
        function mostrarResultado() {
            document.querySelectorAll('.pergunta-card').forEach(function(c) {
                c.style.display = 'none';
            });
            document.getElementById('barra-progresso').style.width = '100%';
            document.getElementById('resultado').classList.add('show');
            document.getElementById('res-placar').textContent = pontos + '/7';

            var msgs = [
                { min: 7, emoji: '🏆', txt: 'Perfeito! Você conhece a saga como o próprio Fantasma de Esparta. Nenhum segredo do Olimpo lhe escapa!' },
                { min: 5, emoji: '⚔️', txt: 'Muito bem! Você domina boa parte da história de Kratos. Digno de um guerreiro espartano!' },
                { min: 3, emoji: '🛡️', txt: 'Razoável. Você conhece o básico, mas ainda há muito para aprender sobre a saga grega.' },
                { min: 0, emoji: '💀', txt: 'Kratos não ficaria orgulhoso... Revise a história da saga e tente novamente, guerreiro.' }
            ];

            var resultado = msgs.find(function(m) { return pontos >= m.min; });
            document.getElementById('res-emoji').textContent = resultado.emoji;
            document.getElementById('res-msg').textContent = resultado.txt;
        }

        // ===== REINICIA O QUIZ =====
        function reiniciar() {
            atual = 0;
            pontos = 0;
            respondeu = false;
            document.getElementById('resultado').classList.remove('show');
            document.getElementById('barra-progresso').style.width = '0%';
            renderizar();
        }

        // Inicia o quiz ao carregar a página
        renderizar();
    </script>

</body>
</html>
