<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../CSS/style.css">
    <link rel="stylesheet" href="../CSS/login.css">
    <title>God Of War — Login</title>
</head>
<body>
 
    <!-- HEADER -->
    <header class="header_style">
        <div style="display:flex; gap:12px; align-items:center;">
            <a href="cadastro.html" class="botao_nav">Cadastro</a>
            <a href="login.html" class="botao_nav">Login</a>
        </div>
 
        <div class="div_logo">God Of War</div>
 
        <div style="display: flex; align-items: center; gap: 12px;">
            <a class="botao_nav" href="index.html">Início</a>
        </div>
    </header>
 
    <div class="pagina-login-wrapper">
        <div class="login-card">
 
            <div class="login-linha-topo"></div>
 
            <div class="login-box">
 
                <div class="login-titulo">Login</div>
                <div class="login-subtitulo">Acesse o Olimpo</div>
 
                <div class="campo-grupo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="seu@email.com">
                </div>
 
                <div class="campo-grupo">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" placeholder="••••••••">
                </div>
 
                <!-- Mensagem de erro ou sucesso -->
                <div id="msg-feedback" class="msg-feedback"></div>
 
                <button class="btn-login" onclick="fazerLogin()">Entrar no Olimpo</button>
 
                <div class="divisor">— ou —</div>
 
                <div class="link-cadastro">
                    Novo guerreiro? <a href="cadastro.html">Criar conta</a>
                </div>
 
            </div>
        </div>
    </div>
</body>
    <script>
        function fazerLogin() {
            var email = document.getElementById('email').value.trim()
            var senha = document.getElementById('senha').value
            var msgEl = document.getElementById('msg-feedback')
 
            // Verifica se os campos estão preenchidos
            if (email == '' || senha == '') {
                msgEl.textContent = 'Preencha e-mail e senha.'
                msgEl.className = 'msg-feedback erro'
                return
            }
 
            // Lê a lista de usuários cadastrados
            var texto = localStorage.getItem('usuarios')
            var usuarios = []
            if (texto != null) {
                usuarios = JSON.parse(texto)
            }
 
            // Procura um usuário com o e-mail e senha corretos
            var usuarioEncontrado = null
            var i = 0
            while (i < usuarios.length) {
                if (usuarios[i].email == email && usuarios[i].senha == senha) {
                    usuarioEncontrado = usuarios[i]
                }
                i++
            }
 
            // Se não achou, mostra erro
            if (usuarioEncontrado == null) {
                msgEl.textContent = 'E-mail ou senha incorretos.'
                msgEl.className = 'msg-feedback erro'
                return
            }
 
            // Login OK: salva quem está logado e vai para o quiz
            localStorage.setItem('usuarioLogado', JSON.stringify(usuarioEncontrado))
            msgEl.textContent = 'Bem-vindo, ' + usuarioEncontrado.nome + '! Redirecionando...'
            msgEl.className = 'msg-feedback sucesso'
            setTimeout(function() {
                window.location.href = 'quiz.html'
            }, 1500)
        }
    </script>
 
</html>
