<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../CSS/cadastro_style.css">
    <link rel="stylesheet" href="cadastro.js">
    <title>God Of War - Cadastro</title>
</head>
<body>

    <!-- HEADER -->
    <header class="header_style">
        <div style="display:flex; gap:12px; align-items:center;">
            <a href="cadastro.html" class="botao_nav">Cadastro</a>
            <button class="botao_nav" onclick="window.scrollTo({top:0,behavior:'smooth'})">Início</button>
        </div>

        <div class="div_logo">God Of War</div>

        <div class="nav-item">
            <button class="botao_nav">Jogos ▾</button>
            <div class="dropdown">
                <a class="dropdown-item" href="#">God of War: Ascension</a>
                <a class="dropdown-item" href="#">God of War: Chains of Olympus</a>
                <a class="dropdown-item" href="#">God of War (O Primeiro Jogo)</a>
                <a class="dropdown-item" href="#">God of War: Ghost of Sparta</a>
                <a class="dropdown-item" href="#">God of War: Betrayal</a>
                <a class="dropdown-item" href="#">God of War II</a>
                <a class="dropdown-item" href="#">God of War III</a>
            </div>
        </div>
    </header>

    <div class="pagina-wrapper">
        <div class="cadastro-container">

            <div class="cadastro-topo">
                <div class="cadastro-topo-linha"></div>
                <div class="cadastro-icone">🛡️</div>
                <div class="cadastro-titulo">Cadastro</div>
                <div class="cadastro-subtitulo">Junte-se aos guerreiros do Olimpo</div>
            </div>

            <div class="cadastro-form">

                <!-- DADOS PESSOAIS -->
                <div class="secao-label">Dados Pessoais</div>

                <div class="linha-dupla">
                    <div class="campo-grupo">
                        <label>Nome <span class="obrigatorio">*</span></label>
                        <input type="text" id="nome" placeholder="Seu nome">
                    </div>
                    <div class="campo-grupo">
                        <label>Sobrenome <span class="obrigatorio">*</span></label>
                        <input type="text" id="sobrenome" placeholder="Seu sobrenome">
                    </div>
                </div>

                <div class="campo-grupo">
                    <label>Data de Nascimento <span class="obrigatorio">*</span></label>
                    <input type="date" id="nascimento">
                </div>

                <!-- ACESSO -->
                <div class="secao-label" style="margin-top: 28px;">Dados de Acesso</div>

                <div class="campo-grupo">
                    <label>E-mail <span class="obrigatorio">*</span></label>
                    <input type="email" id="email" placeholder="seu@email.com">
                </div>

                <div class="campo-grupo">
                    <label>Nome de usuário <span class="obrigatorio">*</span></label>
                    <input type="text" id="usuario" placeholder="GuerreiroEspartano" oninput="validarUsuario(this)">
                </div>

                <div class="campo-grupo">
                    <label>Senha <span class="obrigatorio">*</span></label>
                    <input type="password" id="senha" placeholder="Mínimo 8 caracteres" oninput="checarForca(this.value)">
                    <div class="forca-senha">
                        <div class="forca-barra" id="fb1"></div>
                        <div class="forca-barra" id="fb2"></div>
                        <div class="forca-barra" id="fb3"></div>
                        <div class="forca-barra" id="fb4"></div>
                        <span class="forca-label" id="forca-texto"></span>
                    </div>
                </div>

                <div class="campo-grupo">
                    <label>Confirmar Senha <span class="obrigatorio">*</span></label>
                    <input type="password" id="confirmar-senha" placeholder="Repita a senha">
                </div>

                <button class="btn-cadastrar" onclick="fazerCadastro()">Forjar minha Conta</button>

                <div class="divisor">— ou —</div>

                <div class="link-login">
                    Já tem uma conta? <a href="login.html">Fazer login</a>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
